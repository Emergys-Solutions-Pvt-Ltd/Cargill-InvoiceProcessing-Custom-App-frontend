# =====================================================================================================
# nginx configuration of the frontend image (copied to /etc/nginx/nginx.conf by the Dockerfiles).
# Non-root nginx (Alpine package), port 8080: serves the React build only - no dependency on the backend.
#
# The SPA calls the API at /api on the same host: route /api/ to the backend in front of this container
# (Kubernetes ingress / load balancer; the "proxy" service in ../docker-compose.yml for local Docker).
# =====================================================================================================
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not reveal the nginx version in headers or error pages
    server_tokens off;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Writable temp paths for a non-root worker (one folder per kind)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        # 8080: non-root nginx cannot bind ports below 1024
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Redirects (e.g. /dir -> /dir/) keep the browser's host and port (relative Location header)
        absolute_redirect off;

        # Liveness probe for the container HEALTHCHECK
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The API is not served here: the ingress / load balancer routes /api/ to the backend on the same host.
        # An /api/ request that still reaches this nginx gets a plain 404 instead of the SPA's index.html.
        location /api/ {
            return 404;
        }

        # Security headers are repeated in each static location: nginx drops inherited add_header
        # directives in a location that has its own add_header (Cache-Control).
        # PDFs are shown in same-origin iframes (InvoicePdfViewer, InboxEmailDetail): frame rules stay 'self'.

        # Fingerprinted Vite build assets never change
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
            try_files $uri =404;
        }

        # Single-page app: unknown paths fall back to index.html (React Router); never cache index.html.
        #
        # Strict Content-Security-Policy (no 'unsafe-inline', no 'unsafe-eval'): scripts and styles only from this
        # origin; MUI's run-time <style> elements (Emotion) are allowed by a per-response nonce. nginx writes the
        # nonce ($request_id, 128-bit random) into <meta name="csp-nonce"> of index.html (sub_filter) and into the
        # header; src/theme/StyleProvider.jsx stamps it on every <style>. login.microsoftonline.com: MSAL token
        # calls (connect-src) and silent renewal (frame-src); change it if VITE_MSAL_AUTHORITY points elsewhere.
        location / {
            sub_filter '__CSP_NONCE__' '$request_id';
            sub_filter_once on;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://login.microsoftonline.com; frame-src 'self' blob: https://login.microsoftonline.com; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
