# =====================================================================================================
# nginx configuration of the frontend image (copied to /etc/nginx/nginx.conf by the Dockerfiles).
# Non-root nginx (Alpine package), port 8080: serves the React build and proxies /api/ to the backend.
#
# The API is reached at the hostname "backend" on port 4000:
#   - full stack (../docker-compose.yml): the API service has the network alias "backend"
#   - frontend only (docker-compose.yml): "backend" maps to the Docker host (API on the host's port 4000)
#   - elsewhere (Kubernetes, ...): name the API service "backend" or edit proxy_pass below
# The hostname must resolve when nginx starts (start the API first).
# =====================================================================================================
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not reveal the nginx version in headers or error pages
    server_tokens off;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Writable temp paths for a non-root worker (one folder per kind)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        # 8080: non-root nginx cannot bind ports below 1024
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Redirects (e.g. /dir -> /dir/) keep the browser's host and port (relative Location header)
        absolute_redirect off;

        # PDF uploads (backend limit 20 MB) and bulk-upload JSON bodies
        client_max_body_size 20m;

        # Liveness probe for the container HEALTHCHECK
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # REST API, Swagger UI and signed attachment downloads. No security headers added here:
        # the API sets its own (helmet) and duplicates with different values make browsers ignore them.
        location /api/ {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Security headers are repeated in each static location: nginx drops inherited add_header
        # directives in a location that has its own add_header (Cache-Control).
        # PDFs are shown in same-origin iframes (InvoicePdfViewer, InboxEmailDetail): frame rules stay 'self'.

        # Fingerprinted Vite build assets never change
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
            try_files $uri =404;
        }

        # Single-page app: unknown paths fall back to index.html (React Router); never cache index.html
        location / {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
