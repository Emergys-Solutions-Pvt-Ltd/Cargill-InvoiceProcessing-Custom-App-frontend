# Frontend only: the built React app on nginx, proxying /api to an API running elsewhere.
#   docker compose up -d --build          -> http://localhost:8080
# By default /api goes to an API on the host (npm run dev or backend/docker-compose.yml on :4000).
# Point it somewhere else with API_UPSTREAM, e.g.  API_UPSTREAM=https://api.example.com docker compose up -d
#
# The full stack (API + frontend) is in ../docker-compose.yml.
name: cargill-custom-apps-web

services:
  web:
    build:
      context: .
    image: cargill-custom-apps-web:latest
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:4000}
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (Docker Desktop provides it already)
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
