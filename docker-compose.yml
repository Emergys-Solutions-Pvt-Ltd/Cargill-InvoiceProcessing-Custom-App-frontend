# Frontend only: the built React app on nginx, no backend dependency.
#   docker compose up -d --build          -> http://localhost:8080
# /api/ is not served by this container (404): pages load, API calls fail. To use the app locally run the
# full stack (../docker-compose.yml, which routes /api/ to the API) or `npm run dev` (Vite proxies /api).
name: cargill-custom-apps-web

services:
  web:
    build:
      context: .
      # Microsoft Entra ID sign-in, read from .env next to this file (build time; IDs only)
      args:
        VITE_MSAL_CLIENT_ID: ${VITE_MSAL_CLIENT_ID:-}
        VITE_MSAL_TENANT_ID: ${VITE_MSAL_TENANT_ID:-}
        VITE_MSAL_AUTHORITY: ${VITE_MSAL_AUTHORITY:-}
        VITE_MSAL_REDIRECT_URI: ${VITE_MSAL_REDIRECT_URI:-}
        VITE_MSAL_POST_LOGOUT_REDIRECT_URI: ${VITE_MSAL_POST_LOGOUT_REDIRECT_URI:-}
        VITE_MSAL_API_SCOPE: ${VITE_MSAL_API_SCOPE:-}
    image: cargill-custom-apps-web:latest
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
