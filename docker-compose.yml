# Frontend only: the built React app on nginx, proxying /api to an API running elsewhere.
#   docker compose up -d --build          -> http://localhost:8080
# /api goes to http://backend:4000 (nginx.conf); here "backend" is the Docker host, so start the API on the
# host first (npm run dev or backend/docker-compose.yml on :4000).
#
# The full stack (API + frontend) is in ../docker-compose.yml.
name: cargill-custom-apps-web

services:
  web:
    build:
      context: .
    image: cargill-custom-apps-web:latest
    extra_hosts:
      # nginx.conf proxies /api/ to http://backend:4000: here "backend" is the Docker host (API on its port 4000)
      - "backend:host-gateway"
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
