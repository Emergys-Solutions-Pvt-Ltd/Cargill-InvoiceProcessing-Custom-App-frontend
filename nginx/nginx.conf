# Main nginx configuration for the frontend image (non-root, Alpine nginx package).
# The server block is rendered at start-up from nginx/default.conf.template (API_UPSTREAM) by
# nginx/docker-entrypoint.sh into /tmp/nginx/conf.d - the only writable place a non-root nginx needs.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Writable temp paths for a non-root worker
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path       /tmp/nginx/proxy_temp;
    fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
    scgi_temp_path        /tmp/nginx/scgi_temp;

    include /tmp/nginx/conf.d/*.conf;
}
